<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Personagens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1>Cadastro de Personagens</h1>
        <p>Preencha os dados abaixo para cadastrar um personagem.</p>

        <form id="formPersonagem">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Digite o nome completo">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="exemplo@email.com">
            </div>

            <div class="mb-3">
                <label for="ano" class="form-label">Ano de Nascimento</label>
                <input type="number" class="form-control" id="ano" placeholder="Ex: 2000">
            </div>

            <div class="mb-3">
                <label for="classe" class="form-label">Classe</label>
                <select class="form-select" id="classe">
                    <option value="">Escolha uma classe</option>
                    <option value="Mago">Mago</option>
                    <option value="Arqueiro">Arqueiro</option>
                    <option value="Lanceiro">Lanceiro</option>
                    <option value="Guerreiro">Guerreiro</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" rows="4" placeholder="Descreva o personagem"></textarea>
            </div>

            <div class="mb-3">
                <label for="imagem" class="form-label">URL da imagem (opcional)</label>
                <input type="url" class="form-control" id="imagem" placeholder="https://exemplo.com/imagem.jpg">
            </div>

            <div id="mensagem"></div>

            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>

        <div id="resultado" class="mt-4"></div>
    </div>

    <script src="scripts/script.js"></script>
</body>
</html>
