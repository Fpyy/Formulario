<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulário de Personagem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">Cadastro de Personagem</h1>

      <form>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="inputNome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="inputNome" placeholder="Digite seu nome">
          </div>
          <div class="col-md-6">
            <label for="inputEmail" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="inputEmail" placeholder="seuemail@exemplo.com">
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="inputAnoNascimento" class="form-label">Ano de Nascimento</label>
            <input type="number" class="form-control" id="inputAnoNascimento" min="1900" max="2026" placeholder="Ex: 2008">
          </div>
          <div class="col-md-6">
            <label for="inputClasse" class="form-label">Classe</label>
            <select id="inputClasse" class="form-select">
              <option selected disabled value="">Escolha...</option>
              <option>Mago</option>
              <option>Arqueiro</option>
              <option>Lanceiro</option>
              <option>Guerreiro</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label for="inputDescricao" class="form-label">Descrição</label>
          <textarea class="form-control" id="inputDescricao" rows="3" placeholder="Descreva brevemente o personagem..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
